[package]
name = "dayz-road-tool"
version = "0.1.6"
edition = "2024"
description = "Desktop road editor for Terrain Builder TV4P projects"

[dependencies]
anyhow = "1"
eframe = "0.31.1"
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
memmap2 = "0.9"

[features]
ui-screenshot = ["eframe/__screenshot"]

[dev-dependencies]
flate2 = "1"
crc32fast = "1"

